name: Render and Deploy

on:
  push:
    branches:
      - main
    paths:
      - "projects/**"
      - "schema/**"
      - "renderer/**"
      - "css/**"
      - "js/**"
  create:
  workflow_dispatch:
    inputs:
      project:
        description: "Project ID to render (e.g. opera-voices-2026). Leave blank to render all."
        required: false
        default: ""
      target:
        description: "Deployment target: production or staging"
        required: false
        default: "production"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

jobs:
  render-and-deploy:
    runs-on: ubuntu-latest
    name: Render → Test → Deploy (${{ github.event.inputs.target || 'production' }})

    if: startsWith(github.ref, 'refs/heads/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Run test suite
        run: node test.js

      - name: Render projects
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          TARGET="${{ github.event.inputs.target || 'production' }}"
          INPUT_PROJECT="${{ github.event.inputs.project }}"

          if [ -n "$INPUT_PROJECT" ]; then
            echo "Fetching from Supabase: $INPUT_PROJECT"
            node fetch-content.js "$INPUT_PROJECT"
            echo "Rendering: $INPUT_PROJECT (target: $TARGET)"
            node render.js "projects/${INPUT_PROJECT}/content.json" --out "dist/${INPUT_PROJECT}"
          else
            echo "No project specified — fetching all from Supabase"
            PROJECT_IDS=$(curl -s "${SUPABASE_URL}/rest/v1/story_engine_projects?select=project_id" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              | node -e "const c=[]; process.stdin.on('data',d=>c.push(d)); process.stdin.on('end',()=>{ const rows=JSON.parse(Buffer.concat(c).toString()); console.log(rows.map(r=>r.project_id).join(' ')); });")
            echo "Projects: $PROJECT_IDS"
            RENDERED=0
            for PROJECT_ID in $PROJECT_IDS; do
              echo "Fetching: $PROJECT_ID"
              node fetch-content.js "$PROJECT_ID"
              echo "Rendering: $PROJECT_ID"
              node render.js "projects/${PROJECT_ID}/content.json" --out "dist/${PROJECT_ID}"
              RENDERED=$((RENDERED + 1))
            done
            echo "Rendered $RENDERED project(s)"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: |
          set -e

          TARGET="${{ github.event.inputs.target || 'production' }}"
          S3_BUCKET="${{ secrets.S3_BUCKET }}"
          INPUT_PROJECT="${{ github.event.inputs.project }}"

          if [ "$TARGET" = "staging" ]; then
            S3_PREFIX="staging"
          else
            S3_PREFIX=""
          fi

          for DIR in dist/*/; do
            PROJECT_ID=$(basename "$DIR")

            if [ -n "$INPUT_PROJECT" ] && [ "$PROJECT_ID" != "$INPUT_PROJECT" ]; then
              continue
            fi

            if [ -n "$S3_PREFIX" ]; then
              S3_PATH="${S3_BUCKET}/${S3_PREFIX}/${PROJECT_ID}/"
            else
              S3_PATH="${S3_BUCKET}/${PROJECT_ID}/"
            fi

            aws s3 sync "$DIR" "s3://${S3_PATH}" \
              --delete \
              --exclude "*" \
              --include "*.html" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "public, max-age=300"

            aws s3 sync "$DIR" "s3://${S3_PATH}" \
              --exclude "*" \
              --include "*.css" \
              --content-type "text/css" \
              --cache-control "public, max-age=86400"

            aws s3 sync "$DIR" "s3://${S3_PATH}" \
              --exclude "*" \
              --include "*.js" \
              --content-type "application/javascript" \
              --cache-control "public, max-age=86400"

            aws s3 sync "$DIR" "s3://${S3_PATH}" \
              --exclude "*.html" \
              --exclude "*.css" \
              --exclude "*.js" \
              --cache-control "public, max-age=86400"

            echo "✓ Deployed: s3://${S3_PATH}"
          done

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          TARGET="${{ github.event.inputs.target || 'production' }}"
          DELIVERY="${{ secrets.DELIVERY_DOMAIN }}"

          echo "## Harpoon Story Engine — Deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${TARGET}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Project | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY

          for OUTPUT_DIR in dist/*/; do
            PROJECT_ID=$(basename "$OUTPUT_DIR")
            if [ "$TARGET" = "staging" ]; then
              URL="https://${DELIVERY}/staging/${PROJECT_ID}/"
            else
              URL="https://${DELIVERY}/${PROJECT_ID}/"
            fi
            echo "| \`${PROJECT_ID}\` | ${URL} |" >> $GITHUB_STEP_SUMMARY
          done

  # ── Electron build ─────────────────────────────────────────────────
  # Runs only when you push a version tag (e.g. v0.2.0)
  # Builds the Mac app and publishes it as a GitHub Release
  # Rachel's running app will detect it and prompt her to update
  build-electron:
    runs-on: macos-latest
    name: Build Electron app

    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build and publish Electron app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:build:mac -- --publish always
