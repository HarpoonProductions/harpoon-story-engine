name: Render and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'projects/**'
      - 'schema/**'
      - 'renderer/**'
      - 'css/**'
  workflow_dispatch:
    inputs:
      project:
        description: 'Project ID to render (e.g. opera-voices-2026). Leave blank to render all.'
        required: false
        default: ''

jobs:
  render-and-deploy:
    runs-on: ubuntu-latest
    name: Render → Test → Deploy

    steps:

      # ── Checkout ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node setup ────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Test suite ────────────────────────────────────────────────
      - name: Run test suite
        run: node test.js

      # ── Render all projects ───────────────────────────────────────
      - name: Render projects
        run: |
          set -e

          INPUT_PROJECT="${{ github.event.inputs.project }}"

          if [ -n "$INPUT_PROJECT" ]; then
            # Render a single named project
            PROJECT_FILE="projects/${INPUT_PROJECT}/content.json"
            if [ ! -f "$PROJECT_FILE" ]; then
              echo "✗ Project file not found: $PROJECT_FILE"
              exit 1
            fi
            echo "Rendering single project: $INPUT_PROJECT"
            node render.js "$PROJECT_FILE" --out "output/${INPUT_PROJECT}"
          else
            # Render all projects found in projects/
            if [ ! -d "projects" ]; then
              echo "No projects/ directory found — nothing to render."
              exit 0
            fi

            RENDERED=0
            for PROJECT_JSON in projects/*/content.json; do
              PROJECT_ID=$(basename $(dirname "$PROJECT_JSON"))
              echo "Rendering: $PROJECT_ID"
              node render.js "$PROJECT_JSON" --out "output/${PROJECT_ID}"
              RENDERED=$((RENDERED + 1))
            done

            echo "Rendered $RENDERED project(s)"
          fi

      # ── Upload to S3 ──────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Sync output to S3
        run: |
          set -e

          INPUT_PROJECT="${{ github.event.inputs.project }}"
          S3_BUCKET="${{ secrets.S3_BUCKET }}"

          if [ -n "$INPUT_PROJECT" ]; then
            # Sync single project
            aws s3 sync "output/${INPUT_PROJECT}/" \
              "s3://${S3_BUCKET}/${INPUT_PROJECT}/" \
              --delete \
              --cache-control "public, max-age=300" \
              --exclude ".DS_Store"

            # Set longer cache on CSS (content-hashing is a future step)
            aws s3 cp "s3://${S3_BUCKET}/${INPUT_PROJECT}/css/" \
              "s3://${S3_BUCKET}/${INPUT_PROJECT}/css/" \
              --recursive \
              --metadata-directive REPLACE \
              --cache-control "public, max-age=86400"

            echo "✓ Deployed: s3://${S3_BUCKET}/${INPUT_PROJECT}/"
          else
            # Sync all rendered output
            for OUTPUT_DIR in output/*/; do
              PROJECT_ID=$(basename "$OUTPUT_DIR")
              aws s3 sync "$OUTPUT_DIR" \
                "s3://${S3_BUCKET}/${PROJECT_ID}/" \
                --delete \
                --cache-control "public, max-age=300" \
                --exclude ".DS_Store"

              aws s3 cp "s3://${S3_BUCKET}/${PROJECT_ID}/css/" \
                "s3://${S3_BUCKET}/${PROJECT_ID}/css/" \
                --recursive \
                --metadata-directive REPLACE \
                --cache-control "public, max-age=86400"

              echo "✓ Deployed: s3://${S3_BUCKET}/${PROJECT_ID}/"
            done
          fi

      # ── Summary ───────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "## Harpoon Story Engine — Deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Project | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          for OUTPUT_DIR in output/*/; do
            PROJECT_ID=$(basename "$OUTPUT_DIR")
            echo "| \`${PROJECT_ID}\` | https://${{ secrets.DELIVERY_DOMAIN }}/${PROJECT_ID}/ |" >> $GITHUB_STEP_SUMMARY
          done
