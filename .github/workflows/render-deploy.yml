name: Render and Deploy

on:
  push:
    branches:
      - main
    paths:
      - "projects/**"
      - "schema/**"
      - "renderer/**"
      - "css/**"
      - "js/**"
      - ".github/workflows/**"
  create:
  workflow_dispatch:
    inputs:
      project:
        description: "Project ID to render (e.g. opera-voices-2026). Leave blank to render all."
        required: false
        default: ""
      target:
        description: "Deployment target: production or staging"
        required: false
        default: "production"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

jobs:
  render-and-deploy:
    runs-on: ubuntu-latest
    name: Render → Test → Deploy (${{ github.event.inputs.target || 'production' }})

    if: startsWith(github.ref, 'refs/heads/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history — the scope-detection step below diffs
          # github.event.before against github.sha, which can be
          # arbitrarily far back if several commits land in one push.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # sharp (used by renderer/pwa.js for icon generation) ships its
        # native binary per-platform via optionalDependencies — omitting
        # optional deps entirely skips the linux-x64 binary this runner
        # actually needs, not just the darwin ones it doesn't. npm still
        # correctly skips truly platform-restricted optional packages
        # (e.g. dmg-license, darwin-only) on its own via package.json's
        # os/cpu fields, so this doesn't reintroduce that problem.
        run: npm ci --include=optional

      - name: Run test suite
        run: node test.js

      # Decides how much of the catalog a push should touch. A push that
      # only edits projects/<id>/content.json files can only affect those
      # specific projects, so it deploys just them. A push touching any
      # shared code (renderer/css/js/schema) could affect an unknown
      # number of projects in ways a file-path diff can't determine —
      # those runs stop after tests pass, and a deploy (staging or
      # production, scoped to whichever projects make sense) is a
      # deliberate manual workflow_dispatch instead. workflow_dispatch's
      # own explicit inputs (project / blank-for-all) are unaffected —
      # this only changes what an automatic push does by itself.
      - name: Determine deploy scope
        id: scope
        run: |
          set -e

          if [ -n "${{ github.event.inputs.project }}" ]; then
            echo "mode=single" >> "$GITHUB_OUTPUT"
            echo "project=${{ github.event.inputs.project }}" >> "$GITHUB_OUTPUT"
            echo "Scope: single project (manual) — ${{ github.event.inputs.project }}"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "Scope: all projects (manual, no project specified)"
            exit 0
          fi

          if [ "${{ github.event_name }}" != "push" ]; then
            # e.g. a 'create' event (new branch/tag) — no diff to scope by
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "Scope: all projects (${{ github.event_name }} event)"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          ZERO_SHA="0000000000000000000000000000000000000000"

          if [ "$BEFORE" = "$ZERO_SHA" ] || ! CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" 2>/dev/null); then
            # New branch, or the diff genuinely failed for some reason —
            # fail open (deploy everything) rather than silently deploy
            # nothing.
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "Scope: all projects (no usable diff — failing open)"
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED"

          NON_PROJECT_CHANGES=$(echo "$CHANGED" | grep -v '^projects/' || true)

          if [ -n "$CHANGED" ] && [ -z "$NON_PROJECT_CHANGES" ]; then
            PROJECT_IDS=$(echo "$CHANGED" | grep '^projects/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            echo "mode=projects" >> "$GITHUB_OUTPUT"
            echo "projects=$PROJECT_IDS" >> "$GITHUB_OUTPUT"
            echo "Scope: content-only push — $PROJECT_IDS"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "Scope: shared code changed — tests only, no deploy"
          fi

      - name: Render projects
        if: steps.scope.outputs.mode != 'none'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          MODE="${{ steps.scope.outputs.mode }}"
          TARGET="${{ github.event.inputs.target || 'production' }}"
          BASE_PREFIX=$([ "$TARGET" = "staging" ] && echo "staging/" || echo "")

          render_one() {
            local PROJECT_ID="$1"
            echo "Fetching: $PROJECT_ID"
            node fetch-content.js "$PROJECT_ID"
            echo "Rendering: $PROJECT_ID (target: $TARGET)"
            node render.js "projects/${PROJECT_ID}/content.json" --out "dist/${PROJECT_ID}" --base "${BASE_PREFIX}${PROJECT_ID}"
          }

          if [ "$MODE" = "single" ]; then
            render_one "${{ steps.scope.outputs.project }}"

          elif [ "$MODE" = "projects" ]; then
            echo "Rendering scoped project(s): ${{ steps.scope.outputs.projects }}"
            for PROJECT_ID in ${{ steps.scope.outputs.projects }}; do
              render_one "$PROJECT_ID"
            done

          else
            echo "No project specified — fetching all from Supabase"
            PROJECT_IDS=$(curl -s "${SUPABASE_URL}/rest/v1/story_engine_projects?select=project_id" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              | node -e "const c=[]; process.stdin.on('data',d=>c.push(d)); process.stdin.on('end',()=>{ const rows=JSON.parse(Buffer.concat(c).toString()); console.log(rows.map(r=>r.project_id).join(' ')); });")
            echo "Projects: $PROJECT_IDS"
            for PROJECT_ID in $PROJECT_IDS; do
              render_one "$PROJECT_ID"
            done
          fi

      - name: No deploy — shared code change
        if: steps.scope.outputs.mode == 'none'
        run: |
          echo "## Harpoon Story Engine — tests passed, nothing deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This push touched shared code (renderer/css/js/schema), not just project content, so it wasn't auto-deployed." >> $GITHUB_STEP_SUMMARY
          echo "Trigger **Render and Deploy** manually (workflow_dispatch) once you've reviewed it — leave \"project\" blank to deploy everything, or name a project to deploy just that one." >> $GITHUB_STEP_SUMMARY

      - name: Install Puppeteer system dependencies
        if: steps.scope.outputs.mode != 'none'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libgbm-dev libasound2t64 libxss1 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libgtk-3-0 libnspr4 libnss3 libxcomposite1 \
            libxdamage1 libxrandr2 libxfixes3

      - name: Install Python dependencies
        if: steps.scope.outputs.mode != 'none'
        run: pip install -r requirements.txt --quiet

      - name: Generate PDFs
        if: steps.scope.outputs.mode != 'none'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          INPUT_PROJECT="${{ github.event.inputs.project }}"
          GENERATED=0

          for DIR in dist/*/; do
            PROJECT_ID=$(basename "$DIR")
            PREVIEW_HTML="${DIR}pdf-preview/index.html"

            # Skip if no pdf-preview file (meta.generate_pdf not enabled)
            if [ ! -f "$PREVIEW_HTML" ]; then
              continue
            fi

            # Skip if a specific project was requested and this isn't it
            if [ -n "$INPUT_PROJECT" ] && [ "$PROJECT_ID" != "$INPUT_PROJECT" ]; then
              continue
            fi

            echo "Generating PDF: $PROJECT_ID"
            node scripts/generate-pdf.js "$PROJECT_ID" \
              --file "$PREVIEW_HTML" \
              --out "${DIR}story.pdf"

            echo "Post-processing for PDF/UA-1 accessibility: $PROJECT_ID"
            python3 scripts/tag-pdf.py "${DIR}story.pdf" "${DIR}story.pdf"

            GENERATED=$((GENERATED + 1))
          done

          echo "Generated $GENERATED PDF(s)"

      - name: Configure AWS credentials
        if: steps.scope.outputs.mode != 'none'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        if: steps.scope.outputs.mode != 'none'
        run: |
          set -e

          TARGET="${{ github.event.inputs.target || 'production' }}"
          S3_BUCKET="${{ secrets.S3_BUCKET }}"
          INPUT_PROJECT="${{ github.event.inputs.project }}"

          if [ "$TARGET" = "staging" ]; then
            S3_PREFIX="staging"
          else
            S3_PREFIX=""
          fi

          for DIR in dist/*/; do
            PROJECT_ID=$(basename "$DIR")

            if [ -n "$INPUT_PROJECT" ] && [ "$PROJECT_ID" != "$INPUT_PROJECT" ]; then
              continue
            fi

            if [ -n "$S3_PREFIX" ]; then
              S3_PATH="${S3_BUCKET}/${S3_PREFIX}/${PROJECT_ID}/"
            else
              S3_PATH="${S3_BUCKET}/${PROJECT_ID}/"
            fi

            aws s3 sync "$DIR" "s3://${S3_PATH}" \
              --delete \
              --exclude "*" \
              --include "*.html" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "public, max-age=300"

            aws s3 sync "$DIR" "s3://${S3_PATH}" \
              --exclude "*" \
              --include "*.css" \
              --content-type "text/css" \
              --cache-control "public, max-age=86400"

            aws s3 sync "$DIR" "s3://${S3_PATH}" \
              --exclude "*" \
              --include "*.js" \
              --exclude "sw.js" \
              --content-type "application/javascript" \
              --cache-control "public, max-age=86400"

            aws s3 sync "$DIR" "s3://${S3_PATH}" \
              --exclude "*.html" \
              --exclude "*.css" \
              --exclude "*.js" \
              --exclude "*.pdf" \
              --cache-control "public, max-age=86400"

            # sw.js — must-revalidate so browsers pick up a new precache list
            # promptly after a deploy, instead of riding out the generic JS
            # max-age=86400 (which would leave returning visitors on a stale
            # service worker, and therefore a stale cached shell, for up to a
            # day even though CloudFront itself was invalidated immediately).
            if [ -f "${DIR}sw.js" ]; then
              aws s3 cp "${DIR}sw.js" "s3://${S3_PATH}sw.js" \
                --content-type "application/javascript" \
                --cache-control "public, max-age=0, must-revalidate"
              echo "✓ sw.js uploaded (no-cache): s3://${S3_PATH}sw.js"
            fi

            # PDFs — explicit content-type, no-cache so clients always get the latest
            if [ -f "${DIR}story.pdf" ]; then
              aws s3 cp "${DIR}story.pdf" "s3://${S3_PATH}story.pdf" \
                --content-type "application/pdf" \
                --content-disposition "inline; filename=\"story.pdf\"" \
                --cache-control "public, max-age=300"
              echo "✓ PDF uploaded: s3://${S3_PATH}story.pdf"
            fi

            echo "✓ Deployed: s3://${S3_PATH}"
          done

      - name: Generate audio
        if: steps.scope.outputs.mode != 'none'
        run: |
          set -e
          INPUT_PROJECT="${{ github.event.inputs.project }}"
          S3_BUCKET="${{ secrets.S3_BUCKET }}"
          GENERATED=0

          for DIR in dist/*/; do
            PROJECT_ID=$(basename "$DIR")
            CONTENT_JSON="projects/${PROJECT_ID}/content.json"

            if [ ! -f "$CONTENT_JSON" ]; then continue; fi

            # Check meta.generate_audio flag
            GENERATE=$(node -e "
              const c = require('./${CONTENT_JSON}');
              process.stdout.write(String(!!(c.meta && c.meta.generate_audio)));
            ")
            if [ "$GENERATE" != "true" ]; then continue; fi

            if [ -n "$INPUT_PROJECT" ] && [ "$PROJECT_ID" != "$INPUT_PROJECT" ]; then
              continue
            fi

            echo "Generating audio: $PROJECT_ID"
            OUTPUT=$(node scripts/generate-audio.js "$PROJECT_ID" \
              --content "$CONTENT_JSON" \
              --bucket "$S3_BUCKET" \
              --prefix "${PROJECT_ID}/")

            echo "$OUTPUT"

            # Polly names the file with a UUID — copy to canonical path and remove the original
            POLLY_KEY=$(echo "$OUTPUT" | grep '^AUDIO_S3_KEY=' | cut -d= -f2-)
            if [ -n "$POLLY_KEY" ]; then
              aws s3 cp "s3://${S3_BUCKET}/${POLLY_KEY}" \
                "s3://${S3_BUCKET}/${PROJECT_ID}/story.mp3" \
                --content-type "audio/mpeg" \
                --cache-control "public, max-age=300"
              aws s3 rm "s3://${S3_BUCKET}/${POLLY_KEY}"
              echo "✓ Audio: s3://${S3_BUCKET}/${PROJECT_ID}/story.mp3"
            fi

            GENERATED=$((GENERATED + 1))
          done

          echo "Generated $GENERATED audio file(s)"

      - name: Invalidate CloudFront cache
        if: steps.scope.outputs.mode != 'none'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deployment summary
        if: steps.scope.outputs.mode != 'none'
        run: |
          TARGET="${{ github.event.inputs.target || 'production' }}"
          DELIVERY="${{ secrets.DELIVERY_DOMAIN }}"

          echo "## Harpoon Story Engine — Deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${TARGET}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Project | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY

          for OUTPUT_DIR in dist/*/; do
            PROJECT_ID=$(basename "$OUTPUT_DIR")
            if [ "$TARGET" = "staging" ]; then
              URL="https://${DELIVERY}/staging/${PROJECT_ID}/"
            else
              URL="https://${DELIVERY}/${PROJECT_ID}/"
            fi
            echo "| \`${PROJECT_ID}\` | ${URL} |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commit = context.sha.slice(0, 7);
            const msg = context.payload.head_commit?.message?.split('\n')[0] || 'unknown commit';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Deploy failed — ${commit} "${msg}"`,
              body: [
                `The **Render and Deploy** workflow failed on commit [\`${commit}\`](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}).`,
                ``,
                `**Commit message:** ${msg}`,
                `**Run:** ${runUrl}`,
                ``,
                `Check the run log for the specific error — schema validation failures will show the exact field and project.`,
                ``,
                `_Close this issue once the fix is pushed and the deployment succeeds._`,
              ].join('\n'),
              labels: ['deployment-failure'],
            });

  # ── Electron build ─────────────────────────────────────────────────
  # Runs only when you push a version tag (e.g. v0.2.0)
  # Builds the Mac app and publishes it as a GitHub Release
  # Rachel's running app will detect it and prompt her to update
  build-electron:
    runs-on: macos-latest
    name: Build Electron app

    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build and publish Electron app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:build:mac -- --publish always
