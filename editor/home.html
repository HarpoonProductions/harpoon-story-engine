<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Harpoon Story Engine</title>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --bg: #f7f6f3;
                --bg-2: #eeecea;
                --ink: #1a1916;
                --ink-2: #3d3c39;
                --ink-3: #7a7870;
                --accent: #8b3a2a;
                --rule: rgba(26, 25, 22, 0.1);
                --font-body:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
                    Arial, sans-serif;
                --font-mono: "SF Mono", "Fira Code", "Roboto Mono", monospace;
            }

            html,
            body {
                min-height: 100%;
                background: var(--bg);
                color: var(--ink);
                font-family: var(--font-body);
                font-size: 13px;
                line-height: 1.5;
            }

            /* Focus visible */
            :focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 3px;
                border-radius: 2px;
            }
            :focus:not(:focus-visible) {
                outline: none;
            }

            .shell {
                min-height: 100vh;
                display: grid;
                grid-template-rows: auto 1fr auto;
            }

            header {
                padding: 1rem 1.75rem;
                border-bottom: 1px solid var(--rule);
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: white;
                -webkit-app-region: drag;
            }
            header button,
            header a {
                -webkit-app-region: no-drag;
            }

            .wordmark {
                display: flex;
                align-items: center;
                gap: 0.6rem;
            }
            .wordmark__harpoon {
                font-family: var(--font-mono);
                font-size: 0.58rem;
                letter-spacing: 0.26em;
                text-transform: uppercase;
                color: var(--ink-3);
            }
            .wordmark__sep {
                width: 1px;
                height: 10px;
                background: var(--rule);
            }
            .wordmark__title {
                font-family: var(--font-mono);
                font-size: 0.68rem;
                letter-spacing: 0.16em;
                text-transform: uppercase;
                color: var(--accent);
                font-weight: 400;
            }

            main {
                padding: 2rem 1.75rem;
                max-width: 960px;
            }

            .section-label {
                font-family: var(--font-mono);
                font-size: 0.58rem;
                letter-spacing: 0.26em;
                text-transform: uppercase;
                color: var(--ink-3);
                margin-bottom: 0.75rem;
            }

            .project-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1px;
                background: var(--rule);
                border: 1px solid var(--rule);
                margin-bottom: 1.5rem;
            }

            .project-card {
                background: white;
                padding: 1rem 1rem 1rem 1.25rem;
                cursor: pointer;
                position: relative;
                display: flex;
                flex-direction: column;
                gap: 0.25rem;
                text-decoration: none;
                color: inherit;
                transition: background 0.12s;
                min-height: 100px;
                overflow: hidden;
            }
            .project-card:hover,
            .project-card:focus-visible {
                background: var(--bg);
            }
            .project-card:focus-visible {
                outline-offset: -2px;
            }

            .project-card__accent {
                position: absolute;
                top: 0;
                left: 0;
                width: 3px;
                height: 100%;
            }
            .project-card__client {
                font-family: var(--font-mono);
                font-size: 0.54rem;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--ink-3);
            }
            .project-card__title {
                font-size: 0.85rem;
                font-weight: 500;
                line-height: 1.3;
                color: var(--ink);
                flex: 1;
            }
            .project-card__meta {
                font-family: var(--font-mono);
                font-size: 0.52rem;
                color: var(--ink-3);
                margin-top: auto;
            }
            .project-card__note {
                font-size: 0.72rem;
                color: var(--ink-3);
                font-style: italic;
                background: none;
                border: none;
                border-bottom: 1px dashed transparent;
                padding: 0;
                width: 100%;
                cursor: text;
                outline: none;
                transition: border-color 0.15s;
                font-family: inherit;
            }
            .project-card__note:hover {
                border-bottom-color: var(--ink-3);
            }
            .project-card__note:focus {
                border-bottom-color: var(--accent);
                color: var(--ink);
            }
            .project-card__note::placeholder {
                color: var(--ink-3);
                opacity: 0.5;
            }
            .project-card__arrow {
                position: absolute;
                top: 0.75rem;
                right: 0.75rem;
                font-size: 0.65rem;
                color: var(--ink-3);
                opacity: 0;
                transition:
                    opacity 0.12s,
                    transform 0.12s;
            }
            .project-card:hover .project-card__arrow,
            .project-card:focus-visible .project-card__arrow {
                opacity: 1;
                transform: translate(2px, -2px);
            }

            .empty-state {
                padding: 2rem;
                text-align: center;
                color: var(--ink-3);
                background: white;
                font-size: 0.8rem;
            }

            /* ── Card actions row ── */
            .project-card__actions {
                display: flex;
                align-items: center;
                gap: 0.4rem;
                margin-top: 0.35rem;
                flex-wrap: wrap;
            }
            .project-card__open {
                font-family: var(--font-mono);
                font-size: 0.5rem;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--accent);
                text-decoration: none;
                padding: 0.2rem 0.4rem;
                border: 1px solid var(--accent);
                border-radius: 2px;
                transition: background 0.12s;
            }
            .project-card__open:hover { background: rgba(139,58,42,0.07); }
            .project-card__backup-btn {
                font-family: var(--font-mono);
                font-size: 0.5rem;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--ink-3);
                background: none;
                border: 1px solid var(--rule);
                border-radius: 2px;
                padding: 0.2rem 0.4rem;
                cursor: pointer;
                transition: all 0.12s;
                white-space: nowrap;
            }
            .project-card__backup-btn:hover { color: var(--ink); border-color: var(--ink-3); background: var(--bg); }
            .project-card__backup-btn.is-loading { opacity: 0.5; pointer-events: none; }
            .project-card__backup-btn.is-done { color: #2d7a4f; border-color: #2d7a4f; }
            .project-card__folder-select {
                font-family: var(--font-mono);
                font-size: 0.5rem;
                letter-spacing: 0.08em;
                color: var(--ink-3);
                background: none;
                border: 1px solid var(--rule);
                border-radius: 2px;
                padding: 0.2rem 0.35rem;
                cursor: pointer;
                outline: none;
                margin-left: auto;
            }
            .project-card__folder-select:hover { border-color: var(--ink-3); color: var(--ink); }

            /* ── Folder sections (collapsible) ── */
            .folder-section {
                margin-top: 0.25rem;
                margin-bottom: 1rem;
            }
            .folder-toggle {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                background: none;
                border: none;
                cursor: pointer;
                padding: 0.4rem 0;
                margin-bottom: 0.5rem;
                color: inherit;
            }
            .folder-toggle:hover .section-label { color: var(--ink-2); }
            .folder-toggle__count {
                font-family: var(--font-mono);
                font-size: 0.52rem;
                color: var(--ink-3);
                background: var(--bg-2);
                border: 1px solid var(--rule);
                border-radius: 2px;
                padding: 0.1rem 0.35rem;
            }
            .folder-toggle__chevron {
                font-size: 0.6rem;
                color: var(--ink-3);
                transition: transform 0.15s;
            }
            .folder-toggle[aria-expanded="true"] .folder-toggle__chevron {
                transform: rotate(90deg);
            }
            .project-card__folder-badge {
                font-family: var(--font-mono);
                font-size: 0.48rem;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--ink-3);
                margin-bottom: 0.1rem;
            }

            .action-strip {
                display: flex;
                gap: 0.6rem;
            }

            .btn {
                display: inline-flex;
                align-items: center;
                gap: 0.35rem;
                padding: 0.45rem 0.9rem;
                font-family: var(--font-mono);
                font-size: 0.6rem;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                cursor: pointer;
                transition: all 0.12s;
                text-decoration: none;
                border-radius: 2px;
            }
            .btn--primary {
                background: var(--accent);
                color: white;
                border: 1px solid var(--accent);
            }
            .btn--primary:hover {
                background: #7a3225;
            }
            .btn--ghost {
                background: white;
                color: var(--ink-2);
                border: 1px solid var(--rule);
            }
            .btn--ghost:hover {
                border-color: var(--ink-3);
                color: var(--ink);
            }

            footer {
                padding: 0.85rem 1.75rem;
                border-top: 1px solid var(--rule);
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: white;
            }
            .footer-note {
                font-family: var(--font-mono);
                font-size: 0.54rem;
                letter-spacing: 0.1em;
                color: var(--ink-3);
            }

            /* ── Modal ── */
            .modal-backdrop {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(26, 25, 22, 0.45);
                z-index: 1000;
                align-items: center;
                justify-content: center;
            }
            .modal-backdrop.is-open {
                display: flex;
            }

            .modal {
                background: white;
                border: 1px solid var(--rule);
                padding: 1.75rem;
                width: 420px;
                max-width: calc(100vw - 2rem);
                box-shadow: 0 8px 24px rgba(26, 25, 22, 0.12);
                border-radius: 2px;
            }
            .modal__title {
                font-size: 1rem;
                font-weight: 600;
                margin-bottom: 0.15rem;
            }
            .modal__subtitle {
                font-family: var(--font-mono);
                font-size: 0.56rem;
                letter-spacing: 0.16em;
                text-transform: uppercase;
                color: var(--ink-3);
                margin-bottom: 1.25rem;
            }

            .field {
                margin-bottom: 0.85rem;
            }
            .field label {
                display: block;
                font-family: var(--font-mono);
                font-size: 0.56rem;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--ink-3);
                margin-bottom: 0.25rem;
            }
            .field input[type="text"] {
                width: 100%;
                background: var(--bg);
                border: 1px solid var(--rule);
                color: var(--ink);
                font-family: var(--font-mono);
                font-size: 0.78rem;
                padding: 0.4rem 0.6rem;
                outline: none;
                transition: border-color 0.12s;
                border-radius: 2px;
            }
            .field input[type="text"]:focus {
                border-color: var(--accent);
            }
            .field input[type="color"] {
                width: 100%;
                background: var(--bg);
                border: 1px solid var(--rule);
                padding: 0.15rem 0.4rem;
                height: 30px;
                cursor: pointer;
                border-radius: 2px;
            }
            .field-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.6rem;
            }
            .field-hint {
                font-size: 0.68rem;
                color: var(--ink-3);
                margin-top: 0.2rem;
            }

            .modal__actions {
                display: flex;
                gap: 0.5rem;
                justify-content: flex-end;
                margin-top: 1.25rem;
                padding-top: 1rem;
                border-top: 1px solid var(--rule);
            }
            .modal__error {
                font-size: 0.72rem;
                color: #c0392b;
                margin-top: 0.5rem;
                display: none;
            }
            .modal__error[role="alert"] {
                display: block;
            }

            @keyframes fadeUp {
                from {
                    opacity: 0;
                    transform: translateY(6px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .section-label {
                animation: fadeUp 0.3s ease both;
            }
            .project-grid {
                animation: fadeUp 0.3s ease both 0.04s;
            }
            .action-strip {
                animation: fadeUp 0.3s ease both 0.1s;
            }

            @media (prefers-reduced-motion: reduce) {
                .section-label,
                .project-grid,
                .action-strip {
                    animation: none;
                }
            }
        </style>
    </head>
    <body>
        <div class="shell">
            <header>
                <div class="wordmark" aria-label="Harpoon Story Engine">
                    <span class="wordmark__harpoon" aria-hidden="true"
                        >Harpoon</span
                    >
                    <div class="wordmark__sep" aria-hidden="true"></div>
                    <span class="wordmark__title" aria-hidden="true"
                        >Story Engine</span
                    >
                </div>
                <button
                    class="btn btn--primary"
                    onclick="openNewModal()"
                    aria-haspopup="dialog"
                >
                    + New story
                </button>
            </header>

            <main>
                <p class="section-label" aria-hidden="true">In production</p>
                <section aria-label="Stories in production">
                    <div class="project-grid" id="productionGrid" role="list">
                        <div class="empty-state" id="emptyState" style="display:none" role="listitem">
                            No stories yet — create your first
                        </div>
                    </div>
                </section>

                <div class="folder-section" id="publishedSection" style="display:none">
                    <button class="folder-toggle" id="publishedToggle" aria-expanded="false" aria-controls="publishedGrid">
                        <span class="section-label" style="margin:0">Published</span>
                        <span class="folder-toggle__count" id="publishedCount"></span>
                        <span class="folder-toggle__chevron" aria-hidden="true">▸</span>
                    </button>
                    <div class="project-grid" id="publishedGrid" role="list" hidden></div>
                </div>

                <div class="folder-section" id="backupsSection" style="display:none">
                    <button class="folder-toggle" id="backupsToggle" aria-expanded="false" aria-controls="backupsGrid">
                        <span class="section-label" style="margin:0">Back up</span>
                        <span class="folder-toggle__count" id="backupsCount"></span>
                        <span class="folder-toggle__chevron" aria-hidden="true">▸</span>
                    </button>
                    <div class="project-grid" id="backupsGrid" role="list" hidden></div>
                </div>

                <div class="folder-section" id="trashSection" style="display:none">
                    <button class="folder-toggle" id="trashToggle" aria-expanded="false" aria-controls="trashGrid">
                        <span class="section-label" style="margin:0">Trash</span>
                        <span class="folder-toggle__count" id="trashCount"></span>
                        <span class="folder-toggle__chevron" aria-hidden="true">▸</span>
                    </button>
                    <div class="project-grid" id="trashGrid" role="list" hidden></div>
                </div>

                <div class="action-strip">
                    <button class="btn btn--ghost" onclick="openExisting()">
                        Open existing JSON
                    </button>
                </div>
            </main>

            <footer role="contentinfo">
                <span class="footer-note">Story Engine — Local Editor</span>
                <span class="footer-note">http://localhost:3001</span>
            </footer>
        </div>

        <!-- New story modal -->
        <div
            class="modal-backdrop"
            id="newModal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalTitle"
            aria-describedby="modalSubtitle"
        >
            <div class="modal">
                <h2 class="modal__title" id="modalTitle">New story</h2>
                <p class="modal__subtitle" id="modalSubtitle">Project setup</p>

                <div class="field">
                    <label for="newTitle">Story title</label>
                    <input
                        type="text"
                        id="newTitle"
                        placeholder="e.g. The State of the Oceans"
                        autocomplete="off"
                    />
                </div>
                <div class="field">
                    <label for="newClient">Client name</label>
                    <input
                        type="text"
                        id="newClient"
                        placeholder="e.g. Royal Opera House"
                        autocomplete="off"
                    />
                </div>
                <div class="field">
                    <label for="newId">Project ID</label>
                    <input
                        type="text"
                        id="newId"
                        placeholder="e.g. oceans-2026"
                        autocomplete="off"
                        aria-describedby="newIdHint"
                    />
                    <p class="field-hint" id="newIdHint">
                        Auto-generated. Lowercase letters, numbers, hyphens
                        only.
                    </p>
                </div>
                <div class="field-row">
                    <div class="field">
                        <label for="newAccent">Primary colour</label>
                        <input type="color" id="newAccent" value="#1A3F6F" />
                    </div>
                    <div class="field">
                        <label for="newAccent2">Secondary colour</label>
                        <input type="color" id="newAccent2" value="#C9A84C" />
                    </div>
                </div>

                <p class="modal__error" id="newError" aria-live="assertive"></p>

                <div class="modal__actions">
                    <button class="btn btn--ghost" onclick="closeNewModal()">
                        Cancel
                    </button>
                    <button class="btn btn--primary" onclick="createProject()">
                        Create →
                    </button>
                </div>
            </div>
        </div>

        <script>
            "use strict";

            // ── Focus trap for modal ──────────────────────────────────────────

            const FOCUSABLE =
                'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
            let lastFocusedBeforeModal = null;

            function trapFocus(e) {
                const modal = document.getElementById("newModal");
                const focusable = Array.from(
                    modal.querySelectorAll(FOCUSABLE),
                ).filter((el) => !el.disabled);
                const first = focusable[0];
                const last = focusable[focusable.length - 1];

                if (e.key === "Tab") {
                    if (e.shiftKey) {
                        if (document.activeElement === first) {
                            e.preventDefault();
                            last.focus();
                        }
                    } else {
                        if (document.activeElement === last) {
                            e.preventDefault();
                            first.focus();
                        }
                    }
                }
                if (e.key === "Escape") {
                    closeNewModal();
                }
            }

            function openNewModal() {
                lastFocusedBeforeModal = document.activeElement;
                const modal = document.getElementById("newModal");
                modal.classList.add("is-open");
                modal.addEventListener("keydown", trapFocus);
                // Move focus into modal
                setTimeout(
                    () => document.getElementById("newTitle").focus(),
                    50,
                );
            }

            function closeNewModal() {
                const modal = document.getElementById("newModal");
                modal.classList.remove("is-open");
                modal.removeEventListener("keydown", trapFocus);
                const errEl = document.getElementById("newError");
                errEl.textContent = "";
                errEl.removeAttribute("role");
                // Return focus to trigger
                if (lastFocusedBeforeModal) lastFocusedBeforeModal.focus();
            }

            // Close on backdrop click
            document
                .getElementById("newModal")
                .addEventListener("click", (e) => {
                    if (e.target === document.getElementById("newModal"))
                        closeNewModal();
                });

            // ── Auto-generate project ID from title ───────────────────────────

            document
                .getElementById("newTitle")
                .addEventListener("input", function () {
                    const slug = this.value
                        .toLowerCase()
                        .replace(/[^a-z0-9\s-]/g, "")
                        .trim()
                        .replace(/\s+/g, "-");
                    document.getElementById("newId").value = slug
                        ? `${slug}-${new Date().getFullYear()}`
                        : "";
                });

            // Enter key in modal submits
            document
                .getElementById("newModal")
                .addEventListener("keydown", (e) => {
                    if (e.key === "Enter" && e.target.tagName !== "BUTTON")
                        createProject();
                });

            // ── Create project ────────────────────────────────────────────────

            async function createProject() {
                const id = document.getElementById("newId").value.trim();
                const title = document.getElementById("newTitle").value.trim();
                const errEl = document.getElementById("newError");

                errEl.textContent = "";
                errEl.removeAttribute("role");

                if (!title || !id) {
                    errEl.textContent = "Title and ID are required.";
                    errEl.setAttribute("role", "alert");
                    errEl.style.display = "block";
                    return;
                }
                if (!/^[a-z0-9-]+$/.test(id)) {
                    errEl.textContent =
                        "ID: lowercase letters, numbers and hyphens only.";
                    errEl.setAttribute("role", "alert");
                    errEl.style.display = "block";
                    return;
                }

                const res = await fetch("/api/project/create", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        id,
                        title,
                        client: document
                            .getElementById("newClient")
                            .value.trim(),
                        accent_color:
                            document.getElementById("newAccent").value,
                        accent_color_2:
                            document.getElementById("newAccent2").value,
                    }),
                });
                const data = await res.json();
                if (!res.ok) {
                    errEl.textContent = data.error || "Something went wrong.";
                    errEl.setAttribute("role", "alert");
                    errEl.style.display = "block";
                    return;
                }
                window.location.href = `/edit/${id}`;
            }

            // ── Folder definitions ────────────────────────────────────────────
            const FOLDERS = [
                { key: "",          label: "In production" },
                { key: "published", label: "Published"     },
                { key: "backups",   label: "Back up"       },
                { key: "trash",     label: "Trash"         },
            ];

            // ── Load projects ─────────────────────────────────────────────────
            async function loadProjects() {
                const res  = await fetch("/api/projects");
                const data = await res.json();

                const buckets = { "": [], published: [], backups: [], trash: [] };
                data.projects.forEach(p => {
                    const key = buckets.hasOwnProperty(p.folder) ? p.folder : "";
                    buckets[key].push(p);
                });

                // Production grid (always visible)
                const prodGrid = document.getElementById("productionGrid");
                const empty    = document.getElementById("emptyState");
                Array.from(prodGrid.children).forEach(c => { if (c !== empty) c.remove(); });
                if (buckets[""].length) {
                    empty.style.display = "none";
                    buckets[""].forEach(p => prodGrid.appendChild(makeCard(p)));
                } else {
                    empty.style.display = "block";
                }

                // Collapsible folder sections
                [
                    { key: "published", sectionId: "publishedSection", gridId: "publishedGrid", countId: "publishedCount" },
                    { key: "backups",   sectionId: "backupsSection",   gridId: "backupsGrid",   countId: "backupsCount"   },
                    { key: "trash",     sectionId: "trashSection",     gridId: "trashGrid",     countId: "trashCount"     },
                ].forEach(({ key, sectionId, gridId, countId }) => {
                    const sec   = document.getElementById(sectionId);
                    const grid  = document.getElementById(gridId);
                    const count = document.getElementById(countId);
                    const items = buckets[key];
                    sec.style.display = items.length ? "block" : "none";
                    count.textContent = items.length || "";
                    grid.innerHTML = "";
                    items.forEach(p => grid.appendChild(makeCard(p)));
                });
            }

            // ── Unified card builder ──────────────────────────────────────────
            function makeCard(p) {
                const card = document.createElement("div");
                card.className = "project-card";
                card.setAttribute("role", "listitem");

                const ago        = p.last_saved ? timeAgo(p.last_saved) : "Never edited";
                const noteVal    = (p.note || "").replace(/"/g, "&quot;");
                const folderBadge = p.folder
                    ? `<span class="project-card__folder-badge">${FOLDERS.find(f => f.key === p.folder)?.label || p.folder}</span>`
                    : "";
                const backupOfBadge = p.backup_of
                    ? `<span class="project-card__folder-badge">Backup of ${p.backup_of}</span>`
                    : "";

                // Move-to options: all folders except current
                const moveOpts = FOLDERS
                    .filter(f => f.key !== (p.folder || ""))
                    .map(f => `<option value="${f.key}">${f.label}</option>`)
                    .join("");

                const backupBtn = (!p.folder || p.folder === "")
                    ? `<button class="project-card__backup-btn" title="Snapshot this story">Make back up</button>`
                    : "";

                card.innerHTML = `
                    <div class="project-card__accent" style="background:${p.accent_color}" aria-hidden="true"></div>
                    ${folderBadge || backupOfBadge}
                    <span class="project-card__client">${p.client || "—"}</span>
                    <span class="project-card__title">${p.title}</span>
                    <input class="project-card__note" type="text" value="${noteVal}" placeholder="Add a note…" aria-label="Note for ${p.title}">
                    <span class="project-card__meta">${p.id} · ${ago}</span>
                    <div class="project-card__actions">
                        <a class="project-card__open" href="/edit/${p.id}">↗ Open</a>
                        ${backupBtn}
                        <select class="project-card__folder-select" aria-label="Move to folder">
                            <option value="" disabled selected>Move to…</option>
                            ${moveOpts}
                        </select>
                    </div>`;

                // Note field — preventDefault stops the <a> inside card from firing
                const noteInput = card.querySelector(".project-card__note");
                noteInput.addEventListener("click",   e => e.stopPropagation());
                noteInput.addEventListener("keydown", e => { if (e.key === "Enter") noteInput.blur(); });
                noteInput.addEventListener("blur", () => {
                    fetch(`/api/project/${p.id}/note`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ note: noteInput.value }),
                    });
                });

                // Make back up
                const backupBtnEl = card.querySelector(".project-card__backup-btn");
                if (backupBtnEl) {
                    backupBtnEl.addEventListener("click", async (e) => {
                        e.stopPropagation();
                        backupBtnEl.textContent = "Saving…";
                        backupBtnEl.classList.add("is-loading");
                        const r = await fetch(`/api/project/${p.id}/backup`, { method: "POST" });
                        if (r.ok) {
                            backupBtnEl.textContent = "✓ Done";
                            backupBtnEl.classList.remove("is-loading");
                            backupBtnEl.classList.add("is-done");
                            setTimeout(loadProjects, 800);
                        } else {
                            backupBtnEl.textContent = "Failed";
                            backupBtnEl.classList.remove("is-loading");
                        }
                    });
                }

                // Move to folder
                const folderSelect = card.querySelector(".project-card__folder-select");
                folderSelect.addEventListener("click", e => e.stopPropagation());
                folderSelect.addEventListener("change", async () => {
                    await fetch(`/api/project/${p.id}/folder`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ folder: folderSelect.value }),
                    });
                    loadProjects();
                });

                return card;
            }

            // ── Folder section toggles ────────────────────────────────────────
            ["published", "backups", "trash"].forEach(key => {
                document.getElementById(key + "Toggle").addEventListener("click", () => {
                    const toggle = document.getElementById(key + "Toggle");
                    const grid   = document.getElementById(key + "Grid");
                    const open   = toggle.getAttribute("aria-expanded") === "true";
                    toggle.setAttribute("aria-expanded", String(!open));
                    grid.hidden = open;
                });
            });

            function timeAgo(iso) {
                const d = Math.floor((Date.now() - new Date(iso)) / 1000);
                if (d < 60) return "just now";
                if (d < 3600) return `${Math.floor(d / 60)} minutes ago`;
                if (d < 86400) return `${Math.floor(d / 3600)} hours ago`;
                return `${Math.floor(d / 86400)} days ago`;
            }

            function openExisting() {
                const id = prompt("Enter project ID:");
                if (id) window.location.href = `/edit/${id.trim()}`;
            }

            loadProjects();
        </script>
    </body>
</html>
