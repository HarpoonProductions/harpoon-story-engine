<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Harpoon Story Engine</title>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --bg: #f7f6f3;
                --bg-2: #eeecea;
                --ink: #1a1916;
                --ink-2: #3d3c39;
                --ink-3: #7a7870;
                --accent: #8b3a2a;
                --rule: rgba(26, 25, 22, 0.1);
                --font-body:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
                    Arial, sans-serif;
                --font-mono: "SF Mono", "Fira Code", "Roboto Mono", monospace;
            }

            html,
            body {
                min-height: 100%;
                background: var(--bg);
                color: var(--ink);
                font-family: var(--font-body);
                font-size: 13px;
                line-height: 1.5;
            }

            /* Focus visible */
            :focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 3px;
                border-radius: 2px;
            }
            :focus:not(:focus-visible) {
                outline: none;
            }

            .shell {
                min-height: 100vh;
                display: grid;
                grid-template-rows: auto 1fr auto;
            }

            header {
                padding: 1rem 1.75rem;
                border-bottom: 1px solid var(--rule);
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: white;
                -webkit-app-region: drag;
            }
            header button,
            header a {
                -webkit-app-region: no-drag;
            }

            .wordmark {
                display: flex;
                align-items: center;
                gap: 0.6rem;
            }
            .wordmark__harpoon {
                font-family: var(--font-mono);
                font-size: 0.58rem;
                letter-spacing: 0.26em;
                text-transform: uppercase;
                color: var(--ink-3);
            }
            .wordmark__sep {
                width: 1px;
                height: 10px;
                background: var(--rule);
            }
            .wordmark__title {
                font-family: var(--font-mono);
                font-size: 0.68rem;
                letter-spacing: 0.16em;
                text-transform: uppercase;
                color: var(--accent);
                font-weight: 400;
            }

            main {
                padding: 2rem 1.75rem;
                max-width: 960px;
            }

            .section-label {
                font-family: var(--font-mono);
                font-size: 0.58rem;
                letter-spacing: 0.26em;
                text-transform: uppercase;
                color: var(--ink-3);
                margin-bottom: 0.75rem;
            }

            .project-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1px;
                background: var(--rule);
                border: 1px solid var(--rule);
                margin-bottom: 1.5rem;
            }

            .project-card {
                background: white;
                padding: 1rem 1rem 1rem 1.25rem;
                cursor: pointer;
                position: relative;
                display: flex;
                flex-direction: column;
                gap: 0.25rem;
                text-decoration: none;
                color: inherit;
                transition: background 0.12s;
                min-height: 100px;
                overflow: hidden;
            }
            .project-card:hover,
            .project-card:focus-visible {
                background: var(--bg);
            }
            .project-card:focus-visible {
                outline-offset: -2px;
            }

            .project-card__accent {
                position: absolute;
                top: 0;
                left: 0;
                width: 3px;
                height: 100%;
            }
            .project-card__client {
                font-family: var(--font-mono);
                font-size: 0.54rem;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--ink-3);
            }
            .project-card__title {
                font-size: 0.85rem;
                font-weight: 500;
                line-height: 1.3;
                color: var(--ink);
                flex: 1;
            }
            .project-card__meta {
                font-family: var(--font-mono);
                font-size: 0.52rem;
                color: var(--ink-3);
                margin-top: auto;
            }
            .project-card__arrow {
                position: absolute;
                top: 0.75rem;
                right: 0.75rem;
                font-size: 0.65rem;
                color: var(--ink-3);
                opacity: 0;
                transition:
                    opacity 0.12s,
                    transform 0.12s;
            }
            .project-card:hover .project-card__arrow,
            .project-card:focus-visible .project-card__arrow {
                opacity: 1;
                transform: translate(2px, -2px);
            }

            .empty-state {
                padding: 2rem;
                text-align: center;
                color: var(--ink-3);
                background: white;
                font-size: 0.8rem;
            }

            /* ── Backup button on project cards ── */
            .project-card__backup {
                position: absolute;
                bottom: 0.65rem;
                right: 0.65rem;
                font-family: var(--font-mono);
                font-size: 0.5rem;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--ink-3);
                background: var(--bg-2);
                border: 1px solid var(--rule);
                border-radius: 2px;
                padding: 0.2rem 0.45rem;
                cursor: pointer;
                opacity: 0;
                transition: opacity 0.12s, background 0.12s;
                white-space: nowrap;
            }
            .project-card:hover .project-card__backup {
                opacity: 1;
            }
            .project-card__backup:hover {
                background: white;
                color: var(--ink);
                border-color: var(--ink-3);
            }
            .project-card__backup.is-loading {
                opacity: 1;
                color: var(--ink-3);
                pointer-events: none;
            }
            .project-card__backup.is-done {
                opacity: 1;
                color: #2d7a4f;
                border-color: #2d7a4f;
                background: #f0faf4;
            }

            /* ── Back Ups section ── */
            .backups-section {
                margin-top: 0.25rem;
                margin-bottom: 1.5rem;
            }
            .backups-toggle {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                background: none;
                border: none;
                cursor: pointer;
                padding: 0.4rem 0;
                margin-bottom: 0.5rem;
                color: inherit;
            }
            .backups-toggle:hover .section-label {
                color: var(--ink-2);
            }
            .backups-toggle__count {
                font-family: var(--font-mono);
                font-size: 0.52rem;
                color: var(--ink-3);
                background: var(--bg-2);
                border: 1px solid var(--rule);
                border-radius: 2px;
                padding: 0.1rem 0.35rem;
            }
            .backups-toggle__chevron {
                font-size: 0.6rem;
                color: var(--ink-3);
                transition: transform 0.15s;
            }
            .backups-toggle[aria-expanded="true"] .backups-toggle__chevron {
                transform: rotate(90deg);
            }

            /* ── Backup card variant ── */
            .project-card--backup {
                background: var(--bg);
                opacity: 0.85;
            }
            .project-card--backup:hover {
                background: var(--bg-2);
                opacity: 1;
            }
            .project-card__backup-of {
                font-family: var(--font-mono);
                font-size: 0.5rem;
                letter-spacing: 0.1em;
                color: var(--ink-3);
                text-transform: uppercase;
            }
            .project-card__promote {
                display: inline-flex;
                align-items: center;
                margin-top: 0.35rem;
                font-family: var(--font-mono);
                font-size: 0.5rem;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--accent);
                background: none;
                border: 1px solid transparent;
                border-radius: 2px;
                padding: 0.2rem 0.4rem 0.2rem 0;
                cursor: pointer;
                transition: all 0.12s;
            }
            .project-card__promote:hover {
                border-color: var(--accent);
                padding-left: 0.4rem;
            }

            .action-strip {
                display: flex;
                gap: 0.6rem;
            }

            .btn {
                display: inline-flex;
                align-items: center;
                gap: 0.35rem;
                padding: 0.45rem 0.9rem;
                font-family: var(--font-mono);
                font-size: 0.6rem;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                cursor: pointer;
                transition: all 0.12s;
                text-decoration: none;
                border-radius: 2px;
            }
            .btn--primary {
                background: var(--accent);
                color: white;
                border: 1px solid var(--accent);
            }
            .btn--primary:hover {
                background: #7a3225;
            }
            .btn--ghost {
                background: white;
                color: var(--ink-2);
                border: 1px solid var(--rule);
            }
            .btn--ghost:hover {
                border-color: var(--ink-3);
                color: var(--ink);
            }

            footer {
                padding: 0.85rem 1.75rem;
                border-top: 1px solid var(--rule);
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: white;
            }
            .footer-note {
                font-family: var(--font-mono);
                font-size: 0.54rem;
                letter-spacing: 0.1em;
                color: var(--ink-3);
            }

            /* ── Modal ── */
            .modal-backdrop {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(26, 25, 22, 0.45);
                z-index: 1000;
                align-items: center;
                justify-content: center;
            }
            .modal-backdrop.is-open {
                display: flex;
            }

            .modal {
                background: white;
                border: 1px solid var(--rule);
                padding: 1.75rem;
                width: 420px;
                max-width: calc(100vw - 2rem);
                box-shadow: 0 8px 24px rgba(26, 25, 22, 0.12);
                border-radius: 2px;
            }
            .modal__title {
                font-size: 1rem;
                font-weight: 600;
                margin-bottom: 0.15rem;
            }
            .modal__subtitle {
                font-family: var(--font-mono);
                font-size: 0.56rem;
                letter-spacing: 0.16em;
                text-transform: uppercase;
                color: var(--ink-3);
                margin-bottom: 1.25rem;
            }

            .field {
                margin-bottom: 0.85rem;
            }
            .field label {
                display: block;
                font-family: var(--font-mono);
                font-size: 0.56rem;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--ink-3);
                margin-bottom: 0.25rem;
            }
            .field input[type="text"] {
                width: 100%;
                background: var(--bg);
                border: 1px solid var(--rule);
                color: var(--ink);
                font-family: var(--font-mono);
                font-size: 0.78rem;
                padding: 0.4rem 0.6rem;
                outline: none;
                transition: border-color 0.12s;
                border-radius: 2px;
            }
            .field input[type="text"]:focus {
                border-color: var(--accent);
            }
            .field input[type="color"] {
                width: 100%;
                background: var(--bg);
                border: 1px solid var(--rule);
                padding: 0.15rem 0.4rem;
                height: 30px;
                cursor: pointer;
                border-radius: 2px;
            }
            .field-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.6rem;
            }
            .field-hint {
                font-size: 0.68rem;
                color: var(--ink-3);
                margin-top: 0.2rem;
            }

            .modal__actions {
                display: flex;
                gap: 0.5rem;
                justify-content: flex-end;
                margin-top: 1.25rem;
                padding-top: 1rem;
                border-top: 1px solid var(--rule);
            }
            .modal__error {
                font-size: 0.72rem;
                color: #c0392b;
                margin-top: 0.5rem;
                display: none;
            }
            .modal__error[role="alert"] {
                display: block;
            }

            @keyframes fadeUp {
                from {
                    opacity: 0;
                    transform: translateY(6px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .section-label {
                animation: fadeUp 0.3s ease both;
            }
            .project-grid {
                animation: fadeUp 0.3s ease both 0.04s;
            }
            .action-strip {
                animation: fadeUp 0.3s ease both 0.1s;
            }

            @media (prefers-reduced-motion: reduce) {
                .section-label,
                .project-grid,
                .action-strip {
                    animation: none;
                }
            }
        </style>
    </head>
    <body>
        <div class="shell">
            <header>
                <div class="wordmark" aria-label="Harpoon Story Engine">
                    <span class="wordmark__harpoon" aria-hidden="true"
                        >Harpoon</span
                    >
                    <div class="wordmark__sep" aria-hidden="true"></div>
                    <span class="wordmark__title" aria-hidden="true"
                        >Story Engine</span
                    >
                </div>
                <button
                    class="btn btn--primary"
                    onclick="openNewModal()"
                    aria-haspopup="dialog"
                >
                    + New story
                </button>
            </header>

            <main>
                <p class="section-label" aria-hidden="true">Projects</p>
                <section aria-label="Recent projects">
                    <div class="project-grid" id="projectGrid" role="list">
                        <div
                            class="empty-state"
                            id="emptyState"
                            style="display: none"
                            role="listitem"
                        >
                            No projects yet — create your first story
                        </div>
                    </div>
                </section>

                <!-- Back Ups section — collapsed by default -->
                <div class="backups-section" id="backupsSection" style="display:none">
                    <button class="backups-toggle" id="backupsToggle" aria-expanded="false" aria-controls="backupsGrid">
                        <span class="section-label" style="margin:0" aria-hidden="true">Back Ups</span>
                        <span class="backups-toggle__count" id="backupsCount"></span>
                        <span class="backups-toggle__chevron" aria-hidden="true">▸</span>
                    </button>
                    <div class="project-grid" id="backupsGrid" role="list" hidden></div>
                </div>

                <div class="action-strip">
                    <button class="btn btn--ghost" onclick="openExisting()">
                        Open existing JSON
                    </button>
                </div>
            </main>

            <footer role="contentinfo">
                <span class="footer-note">Story Engine — Local Editor</span>
                <span class="footer-note">http://localhost:3001</span>
            </footer>
        </div>

        <!-- New story modal -->
        <div
            class="modal-backdrop"
            id="newModal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalTitle"
            aria-describedby="modalSubtitle"
        >
            <div class="modal">
                <h2 class="modal__title" id="modalTitle">New story</h2>
                <p class="modal__subtitle" id="modalSubtitle">Project setup</p>

                <div class="field">
                    <label for="newTitle">Story title</label>
                    <input
                        type="text"
                        id="newTitle"
                        placeholder="e.g. The State of the Oceans"
                        autocomplete="off"
                    />
                </div>
                <div class="field">
                    <label for="newClient">Client name</label>
                    <input
                        type="text"
                        id="newClient"
                        placeholder="e.g. Royal Opera House"
                        autocomplete="off"
                    />
                </div>
                <div class="field">
                    <label for="newId">Project ID</label>
                    <input
                        type="text"
                        id="newId"
                        placeholder="e.g. oceans-2026"
                        autocomplete="off"
                        aria-describedby="newIdHint"
                    />
                    <p class="field-hint" id="newIdHint">
                        Auto-generated. Lowercase letters, numbers, hyphens
                        only.
                    </p>
                </div>
                <div class="field-row">
                    <div class="field">
                        <label for="newAccent">Primary colour</label>
                        <input type="color" id="newAccent" value="#1A3F6F" />
                    </div>
                    <div class="field">
                        <label for="newAccent2">Secondary colour</label>
                        <input type="color" id="newAccent2" value="#C9A84C" />
                    </div>
                </div>

                <p class="modal__error" id="newError" aria-live="assertive"></p>

                <div class="modal__actions">
                    <button class="btn btn--ghost" onclick="closeNewModal()">
                        Cancel
                    </button>
                    <button class="btn btn--primary" onclick="createProject()">
                        Create →
                    </button>
                </div>
            </div>
        </div>

        <script>
            "use strict";

            // ── Focus trap for modal ──────────────────────────────────────────

            const FOCUSABLE =
                'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
            let lastFocusedBeforeModal = null;

            function trapFocus(e) {
                const modal = document.getElementById("newModal");
                const focusable = Array.from(
                    modal.querySelectorAll(FOCUSABLE),
                ).filter((el) => !el.disabled);
                const first = focusable[0];
                const last = focusable[focusable.length - 1];

                if (e.key === "Tab") {
                    if (e.shiftKey) {
                        if (document.activeElement === first) {
                            e.preventDefault();
                            last.focus();
                        }
                    } else {
                        if (document.activeElement === last) {
                            e.preventDefault();
                            first.focus();
                        }
                    }
                }
                if (e.key === "Escape") {
                    closeNewModal();
                }
            }

            function openNewModal() {
                lastFocusedBeforeModal = document.activeElement;
                const modal = document.getElementById("newModal");
                modal.classList.add("is-open");
                modal.addEventListener("keydown", trapFocus);
                // Move focus into modal
                setTimeout(
                    () => document.getElementById("newTitle").focus(),
                    50,
                );
            }

            function closeNewModal() {
                const modal = document.getElementById("newModal");
                modal.classList.remove("is-open");
                modal.removeEventListener("keydown", trapFocus);
                const errEl = document.getElementById("newError");
                errEl.textContent = "";
                errEl.removeAttribute("role");
                // Return focus to trigger
                if (lastFocusedBeforeModal) lastFocusedBeforeModal.focus();
            }

            // Close on backdrop click
            document
                .getElementById("newModal")
                .addEventListener("click", (e) => {
                    if (e.target === document.getElementById("newModal"))
                        closeNewModal();
                });

            // ── Auto-generate project ID from title ───────────────────────────

            document
                .getElementById("newTitle")
                .addEventListener("input", function () {
                    const slug = this.value
                        .toLowerCase()
                        .replace(/[^a-z0-9\s-]/g, "")
                        .trim()
                        .replace(/\s+/g, "-");
                    document.getElementById("newId").value = slug
                        ? `${slug}-${new Date().getFullYear()}`
                        : "";
                });

            // Enter key in modal submits
            document
                .getElementById("newModal")
                .addEventListener("keydown", (e) => {
                    if (e.key === "Enter" && e.target.tagName !== "BUTTON")
                        createProject();
                });

            // ── Create project ────────────────────────────────────────────────

            async function createProject() {
                const id = document.getElementById("newId").value.trim();
                const title = document.getElementById("newTitle").value.trim();
                const errEl = document.getElementById("newError");

                errEl.textContent = "";
                errEl.removeAttribute("role");

                if (!title || !id) {
                    errEl.textContent = "Title and ID are required.";
                    errEl.setAttribute("role", "alert");
                    errEl.style.display = "block";
                    return;
                }
                if (!/^[a-z0-9-]+$/.test(id)) {
                    errEl.textContent =
                        "ID: lowercase letters, numbers and hyphens only.";
                    errEl.setAttribute("role", "alert");
                    errEl.style.display = "block";
                    return;
                }

                const res = await fetch("/api/project/create", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        id,
                        title,
                        client: document
                            .getElementById("newClient")
                            .value.trim(),
                        accent_color:
                            document.getElementById("newAccent").value,
                        accent_color_2:
                            document.getElementById("newAccent2").value,
                    }),
                });
                const data = await res.json();
                if (!res.ok) {
                    errEl.textContent = data.error || "Something went wrong.";
                    errEl.setAttribute("role", "alert");
                    errEl.style.display = "block";
                    return;
                }
                window.location.href = `/edit/${id}`;
            }

            // ── Load projects ─────────────────────────────────────────────────

            async function loadProjects() {
                const res = await fetch("/api/projects");
                const data = await res.json();

                const grid        = document.getElementById("projectGrid");
                const empty       = document.getElementById("emptyState");
                const backupsSec  = document.getElementById("backupsSection");
                const backupsGrid = document.getElementById("backupsGrid");
                const backupsCount = document.getElementById("backupsCount");

                // Clear grids (keep empty-state sentinel)
                Array.from(grid.children).forEach((c) => { if (c !== empty) c.remove(); });
                backupsGrid.innerHTML = "";

                const active  = data.projects.filter(p => p.folder !== "backups");
                const backups = data.projects.filter(p => p.folder === "backups");

                // ── Active projects ───────────────────────────────────────────
                if (!active.length) {
                    empty.style.display = "block";
                } else {
                    empty.style.display = "none";
                    active.forEach(p => grid.appendChild(makeProjectCard(p)));
                }

                // ── Back Ups section ──────────────────────────────────────────
                if (backups.length) {
                    backupsSec.style.display = "block";
                    backupsCount.textContent = backups.length;
                    backups.forEach(p => backupsGrid.appendChild(makeBackupCard(p)));
                } else {
                    backupsSec.style.display = "none";
                }
            }

            function makeProjectCard(p) {
                const card = document.createElement("a");
                card.className = "project-card";
                card.href = `/edit/${p.id}`;
                card.setAttribute("role", "listitem");
                card.setAttribute("aria-label",
                    `${p.title}${p.client ? ", " + p.client : ""}, last edited ${p.last_saved ? timeAgo(p.last_saved) : "never"}`);
                const ago = p.last_saved ? timeAgo(p.last_saved) : "Never edited";
                card.innerHTML = `
                    <div class="project-card__accent" style="background:${p.accent_color}" aria-hidden="true"></div>
                    <span class="project-card__client" aria-hidden="true">${p.client || "—"}</span>
                    <span class="project-card__title" aria-hidden="true">${p.title}</span>
                    <span class="project-card__meta" aria-hidden="true">${p.id} · ${ago}</span>
                    <span class="project-card__arrow" aria-hidden="true">↗</span>
                    <button class="project-card__backup" aria-label="Back up ${p.title}" title="Create a backup snapshot">Back up</button>`;

                card.querySelector(".project-card__backup").addEventListener("click", async (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const btn = e.currentTarget;
                    btn.textContent = "Saving…";
                    btn.classList.add("is-loading");
                    const r = await fetch(`/api/project/${p.id}/backup`, { method: "POST" });
                    if (r.ok) {
                        btn.textContent = "✓ Backed up";
                        btn.classList.remove("is-loading");
                        btn.classList.add("is-done");
                        setTimeout(loadProjects, 800);
                    } else {
                        btn.textContent = "Failed";
                        btn.classList.remove("is-loading");
                    }
                });
                return card;
            }

            function makeBackupCard(p) {
                const card = document.createElement("div");
                card.className = "project-card project-card--backup";
                card.setAttribute("role", "listitem");
                const ago = p.last_saved ? timeAgo(p.last_saved) : "Unknown";
                const originLabel = p.backup_of ? `Backup of ${p.backup_of}` : "Backup";
                card.innerHTML = `
                    <div class="project-card__accent" style="background:${p.accent_color}" aria-hidden="true"></div>
                    <span class="project-card__backup-of" aria-hidden="true">${originLabel}</span>
                    <span class="project-card__title" aria-hidden="true">${p.title}</span>
                    <span class="project-card__meta" aria-hidden="true">${ago}</span>
                    <a class="project-card__arrow" href="/edit/${p.id}" aria-label="Open backup ${p.title}" title="Open this backup" style="opacity:1;position:relative;top:auto;right:auto;margin-top:0.25rem;display:inline-block">↗ Open</a>
                    <button class="project-card__promote" aria-label="Promote ${p.title} to active">↑ Promote to active</button>`;

                card.querySelector(".project-card__promote").addEventListener("click", async () => {
                    const r = await fetch(`/api/project/${p.id}/folder`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ folder: "" }),
                    });
                    if (r.ok) loadProjects();
                });
                return card;
            }

            // ── Back Ups toggle ───────────────────────────────────────────────
            document.getElementById("backupsToggle").addEventListener("click", () => {
                const toggle = document.getElementById("backupsToggle");
                const grid   = document.getElementById("backupsGrid");
                const open   = toggle.getAttribute("aria-expanded") === "true";
                toggle.setAttribute("aria-expanded", String(!open));
                grid.hidden = open;
            });

            function timeAgo(iso) {
                const d = Math.floor((Date.now() - new Date(iso)) / 1000);
                if (d < 60) return "just now";
                if (d < 3600) return `${Math.floor(d / 60)} minutes ago`;
                if (d < 86400) return `${Math.floor(d / 3600)} hours ago`;
                return `${Math.floor(d / 86400)} days ago`;
            }

            function openExisting() {
                const id = prompt("Enter project ID:");
                if (id) window.location.href = `/edit/${id.trim()}`;
            }

            loadProjects();
        </script>
    </body>
</html>
